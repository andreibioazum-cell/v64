name: Site

# Builds the single-file emulator page (build/index.html) and nothing else.
# Tests run separately in ci.yml, so they do not delay this artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build index.html
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'

      - name: Setup toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/
          key: ${{ runner.os }}-site-${{ hashFiles('src/rust/**', 'Cargo.toml', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-site-

      - name: Build index.html
        run: make build/index.html

      - name: Upload index.html
        uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: build/index.html
          if-no-files-found: error

  release:
    name: Publish latest release
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Get index.html
        uses: actions/download-artifact@v4
        with:
          name: index.html

      - name: Delete old release and tag
        uses: dev-drprasad/delete-tag-and-release@v1.0.1
        with:
          delete_release: true
          tag_name: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release to GitHub
        uses: ncipollo/release-action@v1
        with:
          name: Latest Release
          tag: latest
          commit: master
          body: ${{ github.event.head_commit.message }}
          artifacts: "index.html"
          prerelease: true
