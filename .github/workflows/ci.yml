name: CI

on:
  push:
  pull_request:

jobs:

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run eslint
        run: sudo npm install -g eslint; make eslint

  build:
    runs-on: ubuntu-latest
    name: Build
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      # Builds the wasm core, the closure bundles and build/index.html (the single
      # self-contained page). The test suites are run locally, not here.
      - name: Build
        run: |
          rustc --version
          make all
          make build/v86-fallback.wasm

      - name: Upload index.html
        uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: build/index.html
          if-no-files-found: error

  atapi-a:
    name: ATAPI A current ide.js
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Build debug wasm
        run: make build/v86-debug.wasm
      - name: Download image
        run: |
          mkdir -p images
          curl -L --fail --silent --show-error -o images/linux4.iso https://i.copy.sh/linux4.iso
      - name: Run
        continue-on-error: true
        run: |
          set +e
          timeout 1500 ./tests/api/iso9660.js > /tmp/out.txt 2>&1
          rc=$?
          grep -o 'Test passed\|Booted, inserting generated iso\|Timeout\|Bad iso\|assert' /tmp/out.txt | sort -u | while IFS= read -r line; do echo "::error::A: $line"; done
          echo "::error::A: rc=$rc size=$(stat -c %s images/linux4.iso)"
  atapi-b:
    name: ATAPI B ide.js before the PACKET interrupt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Build debug wasm
        run: make build/v86-debug.wasm
      - name: Download image
        run: |
          mkdir -p images
          curl -L --fail --silent --show-error -o images/linux4.iso https://i.copy.sh/linux4.iso
      - name: Run
        continue-on-error: true
        run: |
          set +e
          git checkout 85874fd -- src/ide.js
          echo "::error::B: checkout rc=$?"
          timeout 1500 ./tests/api/iso9660.js > /tmp/out.txt 2>&1
          rc=$?
          grep -o 'Test passed\|Booted, inserting generated iso\|Timeout\|Bad iso\|assert' /tmp/out.txt | sort -u | while IFS= read -r line; do echo "::error::B: $line"; done
          echo "::error::B: rc=$rc"
  atapi-c:
    name: ATAPI C ide.js before this branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Build debug wasm
        run: make build/v86-debug.wasm
      - name: Download image
        run: |
          mkdir -p images
          curl -L --fail --silent --show-error -o images/linux4.iso https://i.copy.sh/linux4.iso
      - name: Run
        continue-on-error: true
        run: |
          set +e
          git checkout 3395468 -- src/ide.js
          echo "::error::C: checkout rc=$?"
          timeout 1500 ./tests/api/iso9660.js > /tmp/out.txt 2>&1
          rc=$?
          grep -o 'Test passed\|Booted, inserting generated iso\|Timeout\|Bad iso\|assert' /tmp/out.txt | sort -u | while IFS= read -r line; do echo "::error::C: $line"; done
          echo "::error::C: rc=$rc"
