name: CI

on:
  push:
  pull_request:

jobs:

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run eslint
        run: sudo npm install -g eslint; make eslint

  build:
    runs-on: ubuntu-latest
    name: Build
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      # Builds the wasm core, the closure bundles and build/index.html (the single
      # self-contained page). The test suites are run locally, not here.
      - name: Build
        run: |
          rustc --version
          make all
          make build/v86-fallback.wasm

      - name: Upload index.html
        uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: build/index.html
          if-no-files-found: error

  atapi-check:
    name: ATAPI check (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Build debug wasm
        run: make build/v86-debug.wasm

      - name: Download images
        run: |
          mkdir -p images
          curl --compressed --output images/linux4.iso https://i.copy.sh/linux4.iso
          curl --compressed --output images/msdos622.img https://i.copy.sh/msdos622.img

      - name: boot linux and read the CD
        run: ./tests/api/iso9660.js

      - name: insert and eject a CD
        run: ./tests/api/cdrom-insert-eject.js
