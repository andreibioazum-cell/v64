name: CI

on:
  push:
  pull_request:

jobs:

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run eslint
        run: sudo npm install -g eslint; make eslint

  build:
    runs-on: ubuntu-latest
    name: Build
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      # Builds the wasm core, the closure bundles and build/index.html (the single
      # self-contained page). The test suites are run locally, not here.
      - name: Build
        run: |
          rustc --version
          make all
          make build/v86-fallback.wasm

      - name: Upload index.html
        uses: actions/upload-artifact@v4
        with:
          name: index.html
          path: build/index.html
          if-no-files-found: error

  atapi-check:
    name: ATAPI check (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: '24.17.0'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Build debug wasm
        run: make build/v86-debug.wasm

      - name: Download images
        run: |
          mkdir -p images
          curl --compressed --output images/linux4.iso https://i.copy.sh/linux4.iso

      - name: Run with the PACKET interrupt
        continue-on-error: true
        run: |
          set +e
          ./tests/api/iso9660.js > /tmp/with.txt 2>&1
          rc=$?
          echo "::error::with fix: rc=$rc"
          tail -c 2000 /tmp/with.txt | tr '\r' '\n' | grep -v '^$' | tail -12 | while IFS= read -r line; do echo "::error::with: $line"; done

      - name: Run without the PACKET interrupt (baseline)
        continue-on-error: true
        run: |
          git checkout 85874fd -- src/ide.js
          set +e
          ./tests/api/iso9660.js > /tmp/base.txt 2>&1
          rc=$?
          echo "::error::baseline: rc=$rc"
          tail -c 2000 /tmp/base.txt | tr '\r' '\n' | grep -v '^$' | tail -12 | while IFS= read -r line; do echo "::error::base: $line"; done
