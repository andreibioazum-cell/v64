name: tmp-rustfmt-fix

# Temporary: applies the rustfmt config from the Makefile and commits the result
# back to the branch, so the formatting changes can be inspected with git.
# Remove this file once the rustfmt check passes.

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup toolchain
        run: |
          rustup component add rustfmt
          rustfmt --version

      - name: Generate instruction tables
        run: |
          make $(grep -o 'src/rust/gen/[a-z0-9_]*\.rs' Makefile | sort -u)

      - name: Apply rustfmt
        run: |
          cargo fmt --all -- --config fn_single_line=true,control_brace_style=ClosingNextLine

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src
          if git diff --cached --quiet; then
            echo "nothing to format"
          else
            git commit -m "rustfmt: apply the CI rustfmt config"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
